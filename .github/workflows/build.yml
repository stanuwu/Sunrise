name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  settings-upgrade:
    name: Settings upgrade regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure tests
        run: cmake -S tests/settings_upgrade -B build/settings-upgrade-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build/settings-upgrade-tests

      - name: Run tests
        run: ctest --test-dir build/settings-upgrade-tests --output-on-failure

  release:
    name: Release x64
    # The image carries Visual Studio 2026, so the project's own v145 toolset and its
    # 10.0.26100.0 SDK are both present. No toolset override.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Sunrise.sln /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Release-x64
          path: |
            build/x64/Release/steam_api64.dll
            build/x64/Release/steam_api64.pdb
          if-no-files-found: error
